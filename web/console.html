<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Rastro Console</title>
    <meta name="description" content="Rastro analyst console: cattle provenance, environmental evidence, lineage and risk decisions." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('rastro-theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Rastro console needs JavaScript.</noscript>
    <script type="module" src="/src/console-main.tsx"></script>
  </body>
</html>
